[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myb-uniswap-sdk"
version = "2.0.0"
description = "Python library for interacting with Uniswap (Mine Your Business fork of uniswap-python)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mine Your Business", email = "mine.your.business.crypto@gmail.com" }]
keywords = ["uniswap", "ethereum", "exchange", "trading", "web3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "web3>=8.0.0,<9",
    "eth-typing>=5.0.0",
    "hexbytes>=2.0.0",
    "click>=8.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "mypy>=1.10",
    "ruff>=0.9",
    "build>=1.2",
]
docs = [
    "Sphinx>=7",
    "sphinx-book-theme>=1.1",
    "sphinx-click>=6",
]

[project.scripts]
unipy = "uniswap:main"

[project.urls]
Homepage = "https://github.com/mine-your-business/myb-uniswap-sdk"
Issues = "https://github.com/mine-your-business/myb-uniswap-sdk/issues"
Upstream = "https://github.com/uniswap-python/uniswap-python"

[tool.setuptools.packages.find]
include = ["uniswap*"]

[tool.setuptools.package-data]
uniswap = ["py.typed", "assets/*.abi", "assets/**/*.abi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a mainnet RPC in PROVIDER (and anvil for fork tests); skipped otherwise",
]
log_cli = false  # to print logs during tests, set to true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E501"]
