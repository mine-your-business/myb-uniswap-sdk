name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - run: python -m pip install -r requirements.txt -e ".[dev]"
      - run: ruff check .
      - run: mypy --pretty

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - run: python -m pip install -r requirements.txt -e ".[dev]"
      # Offline tests only; tests marked `integration` skip without PROVIDER.
      - run: pytest -ra --cov=uniswap --cov-report=term

  build:
    name: build + install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build
      - run: python -m build
      - name: Smoke-test the wheel outside the source tree
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/python - <<'PY'
          from pathlib import Path
          import uniswap
          from uniswap.util import _load_abi
          assets = Path(uniswap.__file__).parent / "assets"
          names = [str(p.relative_to(assets).with_suffix("")) for p in assets.rglob("*.abi")]
          assert len(names) >= 10, names
          for name in names:
              assert _load_abi(name)
          print(f"wheel ok: {len(names)} ABI files")
          PY
          /tmp/wheel-env/bin/unipy --help

  integration:
    # Forks mainnet with anvil. Runs only when the MAINNET_PROVIDER secret is set
    # (it is not available to pull requests from forks); otherwise the job is a no-op.
    name: integration (mainnet fork)
    runs-on: ubuntu-latest
    env:
      PROVIDER: ${{ secrets.MAINNET_PROVIDER }}
    steps:
      - name: Report skip
        if: env.PROVIDER == ''
        run: echo "::notice::MAINNET_PROVIDER secret not set; skipping integration tests."
      - uses: actions/checkout@v7
        if: env.PROVIDER != ''
      - uses: actions/setup-python@v7
        if: env.PROVIDER != ''
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - uses: foundry-rs/foundry-toolchain@v1
        if: env.PROVIDER != ''
      - if: env.PROVIDER != ''
        run: python -m pip install -r requirements.txt -e ".[dev]"
      - if: env.PROVIDER != ''
        run: pytest -ra -m integration
